<!DOCTYPE html>
<!-- saved from url=(0061)https://bar.utoronto.ca/~nprovart/PCA_Single_Cell_Papers.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>PCA/C-SPIRIT Single Cell Papers</title>
  
  <meta name="keywords" content="scRNA-seq, single cell, plant, Arabidopsis, curation">
  <link rel="stylesheet" type="text/css" href="./efp.css">
  <link href="./tabulator.min.css" rel="stylesheet">
  <script type="text/javascript" src="./tabulator.min.js"></script>
  <script src="./papaparse.min.js"></script>
  <style>
  /* apply to the cell itself */
  .tabulator-cell.truncate {
      overflow: hidden;
  }

  /* IMPORTANT: apply ellipsis to the inner div */
  .tabulator-cell.truncate > div {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
  }
  </style>
</head>

<body>
  <table width="100%" border="0" align="center" cellspacing="1" cellpadding="0">
    <tbody><tr>
      <td>
        <h1 style="vertical-align:middle;"><a href="https://bar.utoronto.ca/"><img src="./bbc_logo_small.gif" alt="To the Bio-Analytic Resource Homepage" border="0" align="absmiddle"></a>&nbsp;<img src="./bar_logo.gif" alt="The Bio-Analytic Resource" border="0" align="absmiddle">&nbsp;PCA/C-SPIRIT Single Cell Papers<br><img src="./green_line.gif" width="98%" alt="" height="6px" border="0"></h1>
      </td>
   </tr>

<tr><td style="text-align:center;">
<img src="./186_papers_stats.PNG" width="500px">
</td></tr>
</tbody></table>


<input type="text" id="search-input" placeholder="Search papers...">
<div id="result-count" style="margin:10px 0; font-weight:bold;">Loading...</div>
<div id="example-table"></div>

<script type="text/javascript">

// helper: strip HTML tags for proper searching
function stripHTML(html){
    let tmp = document.createElement("div");
    tmp.innerHTML = html;
    return tmp.textContent || "";
}

// Initialize Tabulator
var table = new Tabulator("#example-table", {
    autoColumns: true,
    layout: "fitColumns",

    pagination: true,
    paginationSize: 25,
    paginationSizeSelector: [10, 25, 50, 100], // user-selectable page size

    // enhance columns
    autoColumnsDefinitions: function(columns){
      return columns.map(col => {

        col.formatter = function(cell){
            let value = cell.getValue();

            if(!value) return value;

            // create a temporary element
            let tmp = document.createElement("div");
            tmp.innerHTML = value;

            // find all links and force new tab
            tmp.querySelectorAll("a").forEach(link => {
                link.setAttribute("target", "_blank");
                link.setAttribute("rel", "noopener noreferrer"); // good practice
            });

            return tmp.innerHTML;
        };

        col.headerFilter = "input";
        col.sorter = "string";

        // apply truncation only to specific columns

      if(col.field === "Title" || col.field === "Authors" || col.field === "Citation"){
          col.minWidth = 150;
          col.maxWidth = 400;   // adjust as needed
          col.widthGrow = 2;    // allow flexible sizing
          col.cssClass = "truncate";
      }

      return col;
      });
    },

    // fetch + parse CSV
    ajaxRequestFunc: function(url, config, params) {
        return fetch(url)
            .then(response => response.text())
            .then(text => {
                return Papa.parse(text, {
                    header: true,
                    skipEmptyLines: true
                }).data;
            });
    },

    ajaxURL: "./papers.csv",
});


// Global search (HTML-safe)
document.getElementById("search-input").addEventListener("keyup", function(){
    let value = this.value.trim().toLowerCase();

    if(value){
        table.setFilter(data =>
            Object.values(data).some(val =>
                stripHTML(val || "").toLowerCase().includes(value)
            )
        );
    } else {
        table.clearFilter();
    }
});


// Result count display
function updateResultCount(rows) {
    document.getElementById("result-count").textContent =
        rows.length + " papers found";
}
table.on("dataLoaded", function(data) { updateResultCount(data); });
table.on("dataFiltered", function(filters, rows) { updateResultCount(rows); });

</script>




</body></html>
